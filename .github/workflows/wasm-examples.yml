name: 🌐 Website WASM examples
on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:
permissions:
    contents: read
jobs:
    examples:
        name: 🧪 Live examples — Node ${{ matrix.node }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                node: ['22', '24', '26']
        timeout-minutes: 5
        steps:
            - name: 📥 Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
            - name: 🟢 Set up Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: ${{ matrix.node }}
            - name: 🔎 Check live examples against the release runtime
              run: node test-examples/wasm/smoke.cjs
            - name: 📄 Verify rendered page matches its template
              run: |
                  node test-examples/scripts/embed-snippets.js
                  git diff --exit-code -- index.html
